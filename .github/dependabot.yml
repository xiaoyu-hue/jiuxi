version: 2
updates:
  # 第三方 GitHub Action 已全部锁定到 commit SHA + 尾部版本注释（见 .github/workflows/*.yml）。
  # Dependabot 依据尾部版本注释识别当前版本，新版本发布后自动把引用改写为新 SHA
  # 并同步注释，兼顾供应链安全与可更新性。
  # 注意：dependabot.yml 并无 pin-actions 选项（官方选项列表无此键，GitHub schema
  # 校验直接拒绝），SHA 固定由工作流引用本身承载，Dependabot 只负责滚动——勿再添加。
  # 维护要点：滚动机制依赖 uses 引用尾部的版本注释（如 actions/checkout@<sha> # v5），
  # 新增或修改 action 引用时勿删除该注释，否则 Dependabot 无法定位版本、SHA 将冻结。
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # 冷却期：新版本发布后等待数日再出 PR，避开"刚发布即暴雷"的版本
    # （zizmor dependabot-cooldown 要求 default-days >= 7）
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'

  # npm 生产/开发依赖的安全与版本更新
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # 冷却期：同上，避开刚发布即有问题的 npm 版本
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
    labels:
      - 'dependencies'
      - 'npm'
