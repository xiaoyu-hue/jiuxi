# 九溪 · 定时重建（让静态站内容保持新鲜，无需访客触发抓取）
# 每小时重建并部署主站；也可手动 workflow_dispatch 或 repository_dispatch 触发。
# 注：早先每 30 分钟（cron */30）线上一次都没被调度——GitHub 对高频
# schedule 不可靠（官方仅说明"可能延迟"）。降到每小时（24 次/天）后
# 调度可靠性显著提升，且内容新鲜度本就有前端 refreshInBackground 兜底。
# 缺 Cloudflare 密钥时自动跳过部署。
#
# D1 历史同步（阶段 1）：仅 build-cloudflare 一个 job 传入 D1 环境变量——
# 每次定时重建只写一次云端（save-history.mjs 用 INSERT OR REPLACE，天然幂等）。
# 缺任一变量的情况下 save-history.mjs 自动跳过 D1，仅保存本地 JSON，行为与改造前一致。

name: 定时重建（刷新资讯）

on:
  schedule:
    - cron: '0 * * * *' # 每小时重建(1h,比 2h 更新鲜)
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-feeds]

permissions:
  contents: read
  # （zizmor excessive-permissions：所有 job 只需 contents: read；GitHub Pages 权限已随备站移除）

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  build-cloudflare:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    timeout-minutes: 30
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建静态站点
        run: npm run build
        env:
          SITE_URL: https://jiuxi-bm1.pages.dev
      - name: 预抓取并注入动态资讯
        run: node scripts/fetch-feeds.mjs
        # D1 历史快照同步（save-history.mjs 读取这三个变量；缺失则自动跳过，不报错）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cf-dist
          path: dist

  deploy-cloudflare:
    needs: build-cloudflare
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    timeout-minutes: 15
    # 部署互斥（2026-10-15 审查修复 M20）：与 deploy.yml 的 deploy-cloudflare
    # 共用同一组，防止定时重建与 push 部署交错上传 dist 不一致。
    concurrency:
      group: jiuxi-deploy
      cancel-in-progress: false
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - id: check
        name: 检查 Cloudflare 密钥是否已配置
        run: echo "has-token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.has-token == 'true'
        with:
          name: cf-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.has-token == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jiuxi --commit-dirty=true
