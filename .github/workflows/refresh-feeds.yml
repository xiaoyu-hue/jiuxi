# 九溪 · 定时重建（让静态站内容保持新鲜，无需访客触发抓取）
# 每 2 小时重建并双站部署；也可手动 workflow_dispatch 或 repository_dispatch 触发。
# 注：早先每 30 分钟（cron */30）线上一次都没被调度——GitHub 对高频
# schedule 不可靠（官方仅说明“可能延迟”）。降到每 2 小时（12 次/天）后
# 调度可靠性显著提升，且内容新鲜度本就有前端 refreshInBackground 兜底。
# 任一部署失败不影响另一；缺 Cloudflare 密钥时自动跳过 CF 部署。
#
# D1 历史同步（阶段 1）：仅 build-cloudflare 一个 job 传入 D1 环境变量——
# 每次定时重建只写一次云端（save-history.mjs 用 INSERT OR REPLACE，天然幂等）。
# 缺任一变量的情况下 save-history.mjs 自动跳过 D1，仅保存本地 JSON，行为与改造前一致。

name: 定时重建（刷新资讯）

on:
  schedule:
    - cron: '0 */2 * * *' # 每 2 小时（UTC），比 30 分钟档更易被调度
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-feeds]

permissions:
  contents: read
  # pages: write 与 id-token: write 已下沉到 deploy-github-pages job
  # （zizmor excessive-permissions：构建 job 只需要 contents: read）

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建静态站点
        run: npm run build
        env:
          SITE_BASE: /jiuxi/
          SITE_URL: https://xiaoyu-hue.github.io
      - name: 预抓取并注入动态资讯
        run: node scripts/fetch-feeds.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  build-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建静态站点
        run: npm run build
        env:
          SITE_URL: https://jiuxi-bm1.pages.dev
      - name: 预抓取并注入动态资讯
        run: node scripts/fetch-feeds.mjs
        # D1 历史快照同步（save-history.mjs 读取这三个变量；缺失则自动跳过，不报错）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cf-dist
          path: dist

  deploy-github-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-cloudflare:
    needs: build-cloudflare
    runs-on: ubuntu-latest
    steps:
      - id: check
        name: 检查 Cloudflare 密钥是否已配置
        run: echo "has-token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.check.outputs.has-token == 'true'
        with:
          name: cf-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.has-token == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jiuxi --commit-dirty=true
