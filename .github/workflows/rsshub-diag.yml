name: RSSHub 诊断（临时）

on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 探测代表性路由并输出响应体
        env:
          BASE: https://jiuxi-rsshub.xyyovo520.workers.dev
        run: |
          for route in "/36kr/hot-list" "/huxiu/article" "/dongqiudi/top_news" "/smzdm/haowen" "/aibase/daily" "/gamersky/news" "/3dmgame/news" "/meishichina/recipe" "/cnbeta" "/tmtpost/new" "/sina/rollnews" "/sina/sports" "/gelonghui/home" "/chsi/hotnews" "/a9vg" "/jin10"; do
            echo "========== $route =========="
            curl -sS --max-time 25 -w "\n[HTTP %{http_code} · %{size_download}B · %{time_total}s]\n" \
              -H "User-Agent: Jiuxi/1.0" -L "$BASE$route" | head -c 300
            echo
          done
