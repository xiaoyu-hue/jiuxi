# 九溪 · 单站部署（Cloudflare Pages 纯静态站）
# 站点：Cloudflare Pages（需仓库 Secrets: CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）
# 安全增强：每个 job 第一步均装 harden-runner（出口审计模式，只记录不阻断）；
# 部署完成后调用 dast-scan.yml 可复用工作流对生产主站做 ZAP 基线扫描（advisory）。

name: Deploy 九溪（Cloudflare）

on:
  push:
    branches: [main]
  # PR 也跑质量门禁（类型检查 + 测试），避免“盲合并”：
  # 之前仅 push main 触发，导致 PR 上完全看不到构建/测试结果。
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # （zizmor excessive-permissions：所有 job 只需 contents: read；GitHub Pages 权限已随备站移除）

# 按「工作流 + 分支」隔离排队，PR 与主分支互不阻塞；
# main 仍只有一个并发组，可防止部署互相冲突。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 质量门禁：类型检查 + 单元测试（合并门槛）──
  quality:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查（astro check）
        run: npm run check
      - name: 单元测试（vitest + 覆盖率阈值）
        # 2026-10-15 审查 M23：改跑 test:coverage，覆盖率低于
        # vitest.config.ts 阈值（行 75%/语句 75%/函数 70%/分支 60%）即红灯，
        # 防止测试被越改越少。
        run: npm run test:coverage
      # 规范检查：prettier 格式 + eslint 规则。
      # 2026-10-15：全仓清零（439 个格式问题 + 4 error + 3 warning 全部修复）后，
      # 按 v1.1.0 既定计划去掉 continue-on-error，转为强制门禁。
      - name: 格式检查（prettier）
        run: npm run format:check
      - name: 代码规范检查（eslint）
        run: npm run lint

  # ── Cloudflare 构建（base=/）──
  build-cloudflare:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建静态站点
        run: npm run build # 默认 SITE_BASE=/（见 astro.config.mjs）
        env:
          # Cloudflare 主站规范域名（origin；base 为 /）
          SITE_URL: https://jiuxi-bm1.pages.dev
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cf-dist
          path: dist

  deploy-cloudflare:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-cloudflare
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    timeout-minutes: 15
    # 暴露密钥配置状态：冒烟测试 job 据此判断「本次是否真的发生了部署」——
    # 未配 CF 密钥时部署步骤跳过，冒烟测试也应跳过（而非对线上旧版本误报红灯）。
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    # 部署互斥（2026-10-15 审查修复 M20）：与 refresh-feeds.yml 的 deploy-cloudflare
    # 共用同一组，防止定时重建与 push 部署交错上传 dist 不一致。
    # 仅部署 job 互斥；build/quality job 不受影响，PR 门禁不被阻塞。
    concurrency:
      group: jiuxi-deploy
      cancel-in-progress: false
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # 拉取仓库：wrangler pages deploy dist 上传静态产物。本仓库已是纯静态站点
      # （无 functions/ 目录，后端已移除），checkout 仅为保留构建上下文与可复现性，
      # 部署产物完全来自 build-cloudflare job 上传的 cf-dist artifact。
      - name: 拉取仓库（纯静态部署上下文）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - id: check
        name: 检查 Cloudflare 密钥是否已配置
        # secrets 上下文不能用于 if 条件（会导致 workflow 解析失败/红叉），
        # 此处仅在 run 内比较布尔结果并以 output 暴露，不会泄露 token 内容。
        run: echo "has-token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.has-token == 'true'
        with:
          name: cf-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        # 仅当配置了 Cloudflare Secrets 才部署；否则跳过（灰，不红叉）。
        # 配置就绪后若部署真失败，本步会如实变红，便于及时发现。
        if: steps.check.outputs.has-token == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jiuxi --commit-dirty=true

  # ── DAST：部署完成后立即扫描生产主站（调用可复用工作流）──
  zap-baseline:
    # 主站部署成功后才扫；未配 CF 密钥则本 job 自动跳过。
    # ⚠️ 调用方可复用工作流的 job 不允许写 runs-on / continue-on-error（会解析失败），
    # advisory 语义由 dast-scan.yml 内部 job 的 continue-on-error 承载。
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [deploy-cloudflare]
    # 自引用语法（GitHub 2026-07 起官方支持）：$/ 解析到当前运行的提交（zizmor
    # self-repository 修复）；被调工作流不用 secrets，故不传（secrets-inherit 修复）。
    uses: $/.github/workflows/dast-scan.yml

  # ── 部署后冒烟：验证纯静态站内容与构建期注入生效 ──
  # 背景（架构简化：移除后端 Pages Functions + D1）：站点现为纯静态，
  # 所有内容在 build 期由 scripts/fetch-feeds.mjs 抓取并注入各页内嵌 JSON
  # （首页 / 热点榜 / 策展台注入 #jiuxi-feed-all 聚合数据）。原后端冒烟逻辑
  # （探测 /api/feed、/api/history、/api/candidates）已无意义——这些端点随后端一并
  # 删除，访问会回退到 index.html。本 job 改为验证「静态站真的有内容」：
  # 首页 HTTP 200 且含构建期注入的 #jiuxi-feed-all 聚合 JSON；热点榜 / 策展页同样需 200。
  smoke-test:
    # 仅当本次运行真的发生了部署才冒烟（has-token 由 deploy-cloudflare 暴露）：
    # 未配 CF 密钥时部署步骤跳过，对线上旧版本断言会误报红灯；
    # PR 事件时 deploy-cloudflare 整个 job 跳过，其 outputs 为空，本 job 同样跳过。
    # deploy-cloudflare 部署失败时默认 needs 语义也会跳过本 job（冒烟无意义）。
    if: needs.deploy-cloudflare.outputs.has-token == 'true'
    needs: deploy-cloudflare
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: 冒烟测试：静态站必须返回 200 且首页含构建期注入的聚合 JSON
        env:
          # 与 build-cloudflare job 的 SITE_URL 保持一致（Cloudflare 主站规范域名）
          BASE_URL: https://jiuxi-bm1.pages.dev
        run: |
          set -uo pipefail
          fail=0
          # check <名称> <路径> <必须出现的内嵌片段>：最多 3 次尝试（应对 CDN 短暂传播延迟）
          check() {
            local label="$1" path="$2" fragment="$3" attempt code
            for attempt in 1 2 3; do
              code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' "$BASE_URL$path" 2>/dev/null || echo '000')
              if [ "$code" = "200" ]; then
                if [ -z "$fragment" ]; then
                  echo "OK $label：HTTP 200"
                  return 0
                fi
                if curl -sS -m 25 "$BASE_URL$path" 2>/dev/null | grep -q "$fragment"; then
                  echo "OK $label：HTTP 200，且含构建期注入片段（$fragment）"
                  return 0
                fi
                echo "... $label 第 $attempt 次 HTTP 200 但未见预期片段（$fragment）"
              else
                echo "... $label 第 $attempt 次 HTTP $code"
              fi
              [ "$attempt" -lt 3 ] && sleep 12
            done
            echo "::error::$label 连续 3 次未达标（预期 HTTP 200 且含 $fragment）。静态站部署异常——首页可能未注入聚合 JSON 或构建失败，请检查 deploy-cloudflare 日志与 Cloudflare 控制台。"
            return 1
          }
          check 'GET /（首页 + 聚合 JSON 注入）' '/' 'id="jiuxi-feed-all"' || fail=1
          check 'GET /hot（热点榜）' '/hot' '' || fail=1
          check 'GET /curate（策展页）' '/curate' '' || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "::error::静态站冒烟测试未通过——修复前请勿对外宣布「站点正常」"
            exit 1
          fi
          echo "::notice::静态站首页 / 热点榜 / 策展页均返回 200 且首页含构建期注入聚合 JSON，部署链路验证通过"
