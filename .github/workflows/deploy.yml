# 九溪 · 双站部署
# 主站：Cloudflare Pages（需仓库 Secrets: CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）
# 备用：GitHub Pages（已在仓库 Settings 开启，Source=GitHub Actions）
# 两个站点 base 路径不同：GitHub Pages 用 /jiuxi/，Cloudflare 用 /，故各自独立构建。
# 任一失败不影响另一。

name: Deploy 九溪（双站）

on:
  push:
    branches: [main]
  # PR 也跑质量门禁（类型检查 + 测试），避免“盲合并”：
  # 之前仅 push main 触发，导致 PR 上完全看不到构建/测试结果。
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 按「工作流 + 分支」隔离排队，PR 与主分支互不阻塞；
# main 仍只有一个并发组，可防止 Pages 部署互相冲突。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 质量门禁：类型检查 + 单元测试（合并门槛）──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查（astro check）
        run: npm run check
      - name: 单元测试（vitest）
        run: npm run test

  # ── GitHub Pages 构建（base=/jiuxi/）──
  build-pages:
    # 构建与部署只在推送到 main 时进行；PR 上仅跑上面的 quality 门禁，绝不触发部署。
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建静态站点
        run: npm run build
        env:
          SITE_BASE: /jiuxi/
          # GitHub Pages 副站规范域名（origin；/jiuxi 子路径由 base 负责）
          SITE_URL: https://xiaoyu-hue.github.io
      - name: 预抓取并注入动态资讯
        run: node scripts/fetch-feeds.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

  # ── Cloudflare 构建（base=/）──
  build-cloudflare:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建静态站点
        run: npm run build   # 默认 SITE_BASE=/（见 astro.config.mjs）
        env:
          # Cloudflare 主站规范域名（origin；base 为 /）
          SITE_URL: https://jiuxi-bm1.pages.dev
      - name: 预抓取并注入动态资讯
        run: node scripts/fetch-feeds.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cf-dist
          path: dist

  deploy-github-pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  deploy-cloudflare:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-cloudflare
    runs-on: ubuntu-latest
    steps:
      - id: check
        name: 检查 Cloudflare 密钥是否已配置
        # secrets 上下文不能用于 if 条件（会导致 workflow 解析失败/红叉），
        # 此处仅在 run 内比较布尔结果并以 output 暴露，不会泄露 token 内容。
        run: echo "has-token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: steps.check.outputs.has-token == 'true'
        with:
          name: cf-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        # 仅当配置了 Cloudflare Secrets 才部署；否则跳过（灰，不红叉）。
        # 配置就绪后若部署真失败，本步会如实变红，便于及时发现。
        if: steps.check.outputs.has-token == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jiuxi --commit-dirty=true
