# 九溪 · 单站构建 + 安全扫描（Cloudflare Pages 主站 + 轻后端）
# 站点：Cloudflare Pages；上线已改手动（wrangler pages deploy），CI 不再使用 CLOUDFLARE_API_TOKEN
# 安全增强：每个 job 第一步均装 harden-runner（出口审计模式，只记录不阻断）；
# 部署完成后调用 dast-scan.yml 可复用工作流对生产主站做 ZAP 基线扫描（advisory）。

name: Deploy 九溪（Cloudflare）

on:
  push:
    branches: [main]
  # PR 也跑质量门禁（类型检查 + 测试），避免“盲合并”：
  # 之前仅 push main 触发，导致 PR 上完全看不到构建/测试结果。
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # （zizmor excessive-permissions：所有 job 只需 contents: read；GitHub Pages 权限已随备站移除）

# 按「工作流 + 分支」隔离排队，PR 与主分支互不阻塞；
# main 仍只有一个并发组，可防止部署互相冲突。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 质量门禁：类型检查 + 单元测试（合并门槛）──
  quality:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查（astro check）
        run: npm run check
      - name: 单元测试（vitest）
        run: npm run test
      # 规范检查：prettier 格式 + eslint 规则。
      # 当前为 advisory（continue-on-error），避免一次性引入工具链即阻断既有绿流水线；
      # 待本地 `npm run format && npm run lint` 清零后，可去掉 continue-on-error 转为强制门禁。
      - name: 格式检查（prettier）
        run: npm run format:check
        continue-on-error: true
      - name: 代码规范检查（eslint）
        run: npm run lint
        continue-on-error: true

  # ── Cloudflare 构建（base=/）──
  build-cloudflare:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建静态站点
        run: npm run build # 默认 SITE_BASE=/（见 astro.config.mjs）
        env:
          # Cloudflare 主站规范域名（origin；base 为 /）
          SITE_URL: https://jiuxi-bm1.pages.dev
      - name: 预抓取并注入动态资讯
        run: node scripts/fetch-feeds.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cf-dist
          path: dist

  # ── DAST：构建完成后扫描生产主站（调用可复用工作流）──
  zap-baseline:
    # 构建成功后扫生产主站（部署已改手动，扫的是线上现版本；advisory）。
    # ⚠️ 调用方可复用工作流的 job 不允许写 runs-on / continue-on-error（会解析失败），
    # advisory 语义由 dast-scan.yml 内部 job 的 continue-on-error 承载。
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [build-cloudflare]
    # 自引用语法（GitHub 2026-07 起官方支持）：$/ 解析到当前运行的提交（zizmor
    # self-repository 修复）；被调工作流不用 secrets，故不传（secrets-inherit 修复）。
    uses: $/.github/workflows/dast-scan.yml
