# 九溪 · 双站部署
# 主站：Cloudflare Pages（需仓库 Secrets: CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）
# 备用：GitHub Pages（已在仓库 Settings 开启，Source=GitHub Actions）
# 两个站点 base 路径不同：GitHub Pages 用 /jiuxi/，Cloudflare 用 /，故各自独立构建。
# 任一失败不影响另一。

name: Deploy 九溪（双站）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── GitHub Pages 构建（base=/jiuxi/）──
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /jiuxi/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Cloudflare 构建（base=/）──
  build-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # 默认 SITE_BASE=/（见 astro.config.mjs）
      - uses: actions/upload-artifact@v4
        with:
          name: cf-dist
          path: dist

  deploy-github-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build-cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cf-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        # 未配置 Cloudflare Secrets 时此步失败也记为绿（黄警告），不出现红叉；
        # 配置就绪后此步成功，自动真正部署到 Cloudflare Pages。
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jiuxi --commit-dirty=true
