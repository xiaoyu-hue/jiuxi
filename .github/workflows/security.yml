# 九溪 · 安全门禁（独立于 deploy.yml，便于分层查看）
#
# 2026-10-19 瘦身（v1.12.3，用户决策「砍掉难以维护的，保留重要的」）：
# 按「防真实威胁 × 运行成本」评估，九溪是纯静态站（无后端 / 无登录 / 无 API），
# 真实威胁只有三条：
#   ① 密钥泄进仓库  → trufflehog（强制；扫全量提交历史，仅报实测有效的密钥）；
#   ② npm 依赖投毒/漏洞 → osv-scanner（强制）；
#   ③ CI 工作流自身被动手脚 → zizmor（+ 全量 SHA pin）。
# 已砍掉 7 个 job（防的是虚构威胁、重叠能力或无人消费的产物，恢复理由不成立，
#   勿随意加回；如确需恢复先读 git 历史里 v1.12.3 提交说明）：
#   - nuclei（153s，最贵）：扫本地静态产物，纯 HTML/CSS/JS 没有服务端漏洞面；
#   - zap-baseline + dast-scan.yml（82s + 部署后再跑一次）：DAST 扫无攻击面的静态站；
#   - trivy（24s）：与 osv-scanner 扫同一个 npm 依赖树，能力重叠；
#   - gitleaks（18s）：与 trufflehog 抢同一份钥匙（后者还扫全量历史）；
#   - scorecard / sbom（47s）：合规产物，无审计方消费；
#   - dependency-review：单人直推 main 无 PR 流程，永远 skipped 的死代码。
# 降频 2 个：codeql / lychee 改为仅每周定时与手动触发，不再随每次 push 跑。
#
# 门禁强度：
#   **强制**（无 continue-on-error，发现即红灯阻断合并）：trufflehog、osv-scanner。
#   **advisory**（job 级 continue-on-error，单 job 红叉不阻断流水线）：codeql、lychee、zizmor。
#   为什么 advisory 的 continue-on-error 必须写在 job 级别：step 级覆盖不了
#   action 引用解析失败（发生在 "Set up job" 阶段，不属任何 step）。
#
# Action 引用约定：全部 SHA pin + 尾部版本注释（Dependabot 依据注释滚动升级）；
# 官方 action 不可用时改用官方 CLI 二进制 + pin 版本 + SHA256 校验（trufflehog、
# osv-scanner 均如此，供应链面更小且不受 action.yml 损坏影响）。
# 当前在役：checkout@v7.0.1、codeql-action@v4.38.3、lychee-action@v2、
# zizmor-action@v0.6.4、harden-runner@v2.22.1、trufflehog v3.99.2、osv-scanner v2.6.0。
# 每个 job 第一步均装 harden-runner（出口审计模式，只记录不阻断）。

name: 安全门禁

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # 每周一 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read
  # 需要写权限的 job（codeql / zizmor 上传 SARIF）在 job 级单独声明，
  # 不写工作流级（历史教训：scorecard 的 id-token 约束要求工作流级无写权限，
  # 该 job 已删；保持最小权限原则不变）。

jobs:
  # ── 密钥扫描（TruffleHog，全量历史 + 已验证，强制门禁）──
  # 选型理由（v1.12.3 瘦身后为唯一密钥引擎）：
  #   1. git 模式遍历**全部**提交历史，能发现「早已删除但仍在历史里」的密钥；
  #   2. --only-verified 拿密钥去各云厂商 API 实测有效性，只报「真的能用」
  #      的密钥（模式匹配类工具误报率相对高，故敢设强制）。
  # 许可证：TruffleHog 为 AGPL-3.0，本项目代码为 Apache-2.0。CI 中以独立进程
  #   运行其官方二进制，不链接、不分发其源码，AGPL 的网络交互条款不触发，
  #   两许可证互不影响（README「致谢与开源声明」已注明）。
  # 形态与 osv-scanner job 同构：官方 CLI + pin 版本 + SHA256 校验，
  #   不用第三方 action（供应链面更小，且不受 action.yml 损坏影响）。
  # 2026-10-15 审查 M22：由 advisory 转**强制**——只报已验证密钥意味着
  # 误报率足够低，发现真实泄露的密钥必须阻断合并、立即轮换。
  # ⚠️ 转强制风险提示：本 job 扫完整历史，若历史提交里存在已验证密钥，
  #    首次运行即红灯。届时须人工清理历史（git filter-repo / BFG）并轮换
  #    该密钥，或在 run 步骤补 --exclude-paths 精确排除（排除项须在注释中
  #    说明理由，禁止无理由大面积排除）。
  trufflehog:
    runs-on: ubuntu-24.04
    # 强制门禁：不再写 continue-on-error，发现已验证密钥直接红灯阻断合并。
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 必须：TruffleHog git 模式要扫完整提交历史
          persist-credentials: false
      - name: 安装 TruffleHog CLI（pin 版本 + SHA256 校验）
        run: |
          set -euo pipefail
          VERSION="${TRUFFLEHOG_VERSION}"
          PKG="trufflehog_${VERSION#v}_linux_amd64.tar.gz"
          SUMS="trufflehog_${VERSION#v}_checksums.txt"
          BASE="https://github.com/trufflesecurity/trufflehog/releases/download/${VERSION}"
          curl -sSfL -o /tmp/trufflehog.tar.gz "${BASE}/${PKG}"
          curl -sSfL -o /tmp/trufflehog_checksums.txt "${BASE}/${SUMS}"
          # checksums.txt 可能是 "<hash>  name" 或 "<hash> *name" 两种格式，兼容处理
          expected="$(awk -v pkg="$PKG" '{gsub(/^[*]/,"",$2); if($2==pkg) print $1}' /tmp/trufflehog_checksums.txt)"
          actual="$(sha256sum /tmp/trufflehog.tar.gz | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::TruffleHog 压缩包 SHA256 校验失败（期望 ${expected:-<空>} 实际 $actual）"
            exit 1
          fi
          mkdir -p /tmp/trufflehog-bin
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp/trufflehog-bin
          sudo install -m 0755 "$(find /tmp/trufflehog-bin -type f -name trufflehog | head -n 1)" /usr/local/bin/trufflehog
          # --no-update 必须加（原因见下方扫描步骤注释）：自更新器在主入口
          # 初始化时执行，这个留痕调用也会触发它（2026-10-15 实测），此处靠
          # || true 兜底不致命，但扫描步骤没有兜底、必须显式禁用。
          trufflehog --version || true # 仅用于留痕，不参与判定
        env:
          TRUFFLEHOG_VERSION: v3.99.2 # 升级时同步核对 releases 资产名与 checksums 文件名
      - name: TruffleHog（历史密钥扫描，仅已验证，强制门禁）
        # git file:// 模式遍历全部提交历史（checkout 已 fetch-depth: 0）；
        # --only-verified 只报实测有效的密钥（误报率足够低，故敢转强制）；
        # --fail 让发现项以非零退出码使 job 置红、阻断合并（run 步骤默认
        # bash -e 语义，不需要再包 if 捕获——2026-10-15 审查 M22 转强制）。
        # 路径用 shell 环境变量 $GITHUB_WORKSPACE 而非 ${{ }} 插值：避免 zizmor
        # 模板注入检查误报（run 脚本内直接插值上下文表达式是其重点审查对象）。
        # --no-update（2026-10-15 新增）：禁用自更新器。自更新器在 CI 环境
        # 尝试替换 /usr/local/bin/trufflehog 自身二进制失败
        # （"error occurred with trufflehog updater 🐷 {"error":
        # "cannot move binary back (exit status 1)"}"，trufflesecurity/
        # trufflehog#3217 同款问题，本项目 v1.6.1 推送后首次实测复现），
        # 且失败即退出 1——扫描根本没跑就红灯，曾长期被 advisory 的
        # continue-on-error + 输出捕获掩盖为"假绿"。版本由上方安装步骤
        # pin + SHA256 校验固定，CI 环境不应运行时自更新，禁用不影响门禁语义。
        run: |
          trufflehog git "file://$GITHUB_WORKSPACE" --only-verified --fail --no-update
  # ── SAST：CodeQL（公开库免费，无需 token）──

  codeql:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # 2026-10-19 降频：仅每周巡检与手动触发，不再随每次 push 跑
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    permissions:
      contents: read
      security-events: write # CodeQL 上传分析结果需要
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
      - name: CodeQL 分析
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
  # ── 依赖漏洞扫描 ──

  osv-scanner:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    # 2026-10-13 起转强制：eslint 工具链 5 个 high 已修复（升级 eslint-plugin-astro
    # 3.2.1 + eslint 10，绕开 braces 全版本无修复的漏洞链），本地 npm audit 0 漏洞。
    # 不再写 continue-on-error——发现依赖漏洞直接红灯，必须先升级依赖再合并。
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ⚠️ 为什么不用 google/osv-scanner-action：
      #    该仓库根 action.yml 自 v1.9.2 起就缺少顶层 `runs:` 段（实测每个 tag 都是
      #    18 行的残缺文件），runner 会报
      #    “Top level 'runs:' section is required …/action.yml”，
      #    即该 Action 目前整体不可用，与写 @v1 还是 @v2.6.0 无关。
      #    故改为直接使用官方 CLI 二进制（版本 pin + SHA256 校验）。
      - name: 安装 osv-scanner CLI（pin 版本 + SHA256 校验）
        run: |
          set -euo pipefail
          VERSION="${OSV_VERSION}"
          BASE="https://github.com/google/osv-scanner/releases/download/${VERSION}"
          curl -sSfL -o /tmp/osv-scanner "${BASE}/osv-scanner_linux_amd64"
          curl -sSfL -o /tmp/osv-scanner_SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          # SHA256SUMS 可能是 "<hash>  name" 或 "<hash> *name" 两种格式，兼容处理
          expected="$(awk '{gsub(/^[*]/,"",$2); if($2=="osv-scanner_linux_amd64") print $1}' /tmp/osv-scanner_SHA256SUMS)"
          actual="$(sha256sum /tmp/osv-scanner | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::osv-scanner 二进制 SHA256 校验失败（期望 ${expected:-<空>} 实际 $actual）"
            exit 1
          fi
          chmod +x /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version || true # 仅用于留痕，不同版本子命令差异不影响门禁
        env:
          OSV_VERSION: v2.6.0 # 升级时同步核对 releases 资产与 SHA256SUMS
      - name: OSV Scanner（依赖漏洞扫描，强制门禁）
        # 用法按 v2.6.0 README 的官方示例：osv-scanner scan source -r <dir>。
        # 强制语义：发现漏洞即以非零退出码使 job 置红，阻断合并（不包 warning 分支）。
        # 若 CI 报错“发现漏洞”，先在本地方 `npm update` 对应依赖修复后再推送。
        run: |
          osv-scanner scan source -r ./
  # ── 死链校验（文档/页面外链）──

  lychee:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # 2026-10-19 降频：仅每周巡检与手动触发，不再随每次 push 跑
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lychee 死链检查
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-concurrency 4 --exclude-mail './**/*.md'
          fail: false
  # ── CI 工作流自身安全审计（zizmor）──

  zizmor:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    # zizmor 需要 actions:read（读取工作流定义）与 security-events:write（上传 SARIF）。
    # 仓库若未开启 GitHub Advanced Security 公开扫描，上传会失败，
    # 但 zizmor 主扫描步骤在日志中仍可见结果，不影响排查。
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor 官方建议：审计 CI 配置时不应把凭据留在工作区，防止误扫/误用
          persist-credentials: false
      - name: Zizmor（GitHub Actions 工作流安全审计）
        # ⚠️ 仓库已从 woodruffw/zizmor 迁移至 zizmorcore/zizmor（旧路径 404）。
        #    官方文档建议对 zizmor-action 使用完整 SHA pin（该 action 会执行
        #    下载自上游仓库的二进制，移动标签风险高于普通 action），此处照办。
        #    当前 SHA 对应 v0.6.4（实施时与官方文档交叉核对一致）。
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
