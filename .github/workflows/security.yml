# 九溪 · 安全门禁（独立于 deploy.yml，便于分层查看）
#
# 涵盖：密钥扫描(gitleaks) / SAST(CodeQL) / 依赖漏洞(osv-scanner) / 死链(lychee) /
# PR 依赖审查(dependency-review) / CI 工作流审计(zizmor) / 供应链健康分(Scorecard) /
# DAST 动态扫描(ZAP，见 dast-scan.yml 可复用工作流，每周+部署后由本文件与 deploy.yml 调用)。
# 每个 job 第一步均装 harden-runner（出口审计模式）。
#
# 当前均为 advisory：continue-on-error 写在 **job 级别**（不是 step 级别）。
# 原因：step 级别的 continue-on-error 无法覆盖 action 引用解析失败
# （失败发生在 “Set up job” 阶段，不属于任何 step），一旦某个门禁挂掉整条
# 工作流就会变红，advisory 语义形同虚设。写在 job 级别才能真正做到
# “单个门禁失败不影响流水线结论”，同时在 job 行仍保留红叉便于排查。
# 待各门禁连续转绿后，可逐个去掉 continue-on-error 转为强制门禁。
#
# ⚠️ Action 引用约定（本文件已逐个实测，勿凭印象写版本号）：
#   1. 不是所有 Action 都提供大版本移动标签。
#      actions/dependency-review-action 的 v4 就不存在（404），只能 pin v4.9.0。
#   2. 标签存在 ≠ Action 可用。
#      google/osv-scanner-action 所有 tag 的 action.yml 都缺顶层 `runs:` 段，
#      引用即失败，故本项目改用其官方 CLI 二进制（见 osv-scanner job）。
#   3. 仅在 PR 触发的 job 本地永远验证不到（一直是 skipped），
#      例如 dependency-review，引用前更需逐一核实。
#   4. 仓库迁移会改路径：zizmor 的 action 旧路径 woodruffw/zizmor-action 已 404，
#      现为 zizmorcore/zizmor-action（官方文档推荐 SHA pin，故本文件用 SHA）。
#   已核实可用：checkout@v4、github-script@v7、gitleaks@v2、lychee@v2、codeql@v3、
#      zaproxy/action-baseline@v0.15.0、zizmorcore/zizmor-action@v0.6.4（SHA cc914d7f…）、
#      ossf/scorecard-action@v2.5.0、step-security/harden-runner@v2.22.1。

name: 安全门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # 每周一 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read
  # ⚠️ 不要把 security-events: write 写在这里（工作流级）！
  # scorecard-action v2 的 publish_results: true 要求：所在工作流不得有工作流级
  # 写权限，且只有 scorecard 这个 job 能用 id-token: write（用于 GitHub OIDC
  # 签名发布结果）。缺 id-token 时发布会退化为交互式设备流，CI 无人点浏览器，
  # 300 秒后 expired_token → job 失败（2026-10-13 首跑实测踩坑）。
  # 因此需要 security-events: write 的 job（gitleaks/codeql/zizmor/scorecard）
  # 各自在 job 级单独声明。

jobs:
  # ── 密钥扫描 ──
  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory：失败只标红本 job，不阻断整条流水线
    permissions:
      contents: read
      security-events: write # gitleaks-action 自动上传 SARIF 到代码扫描需要
    steps:
      # harden-runner 必须是每个 job 的第一步（pre 步骤，先于 checkout 运行）。
      # audit = 只记录出口流量不阻断；block 模式会断掉本 job 的必要出站连接。
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks（密钥扫描）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  # ── SAST：CodeQL（公开库免费，无需 token）──
  codeql:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    permissions:
      contents: read
      security-events: write # CodeQL 上传分析结果需要
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: CodeQL 分析
        uses: github/codeql-action/analyze@v3

  # ── 依赖漏洞扫描 ──
  osv-scanner:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # ⚠️ 为什么不用 google/osv-scanner-action：
      #    该仓库根 action.yml 自 v1.9.2 起就缺少顶层 `runs:` 段（实测每个 tag 都是
      #    18 行的残缺文件），runner 会报
      #    “Top level 'runs:' section is required …/action.yml”，
      #    即该 Action 目前整体不可用，与写 @v1 还是 @v2.6.0 无关。
      #    故改为直接使用官方 CLI 二进制（版本 pin + SHA256 校验）。
      - name: 安装 osv-scanner CLI（pin 版本 + SHA256 校验）
        run: |
          set -euo pipefail
          VERSION="${OSV_VERSION}"
          BASE="https://github.com/google/osv-scanner/releases/download/${VERSION}"
          curl -sSfL -o /tmp/osv-scanner "${BASE}/osv-scanner_linux_amd64"
          curl -sSfL -o /tmp/osv-scanner_SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          # SHA256SUMS 可能是 "<hash>  name" 或 "<hash> *name" 两种格式，兼容处理
          expected="$(awk '{gsub(/^[*]/,"",$2); if($2=="osv-scanner_linux_amd64") print $1}' /tmp/osv-scanner_SHA256SUMS)"
          actual="$(sha256sum /tmp/osv-scanner | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::osv-scanner 二进制 SHA256 校验失败（期望 ${expected:-<空>} 实际 $actual）"
            exit 1
          fi
          chmod +x /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version || true # 仅用于留痕，不同版本子命令差异不影响门禁
        env:
          OSV_VERSION: v2.6.0 # 升级时同步核对 releases 资产与 SHA256SUMS
      - name: OSV Scanner（依赖漏洞扫描）
        # 用法按 v2.6.0 README 的官方示例：osv-scanner scan source -r <dir>
        # （v1 的 `osv-scanner --recursive --skip-git ./` 在 v2 子命令体系下不再适用）
        # advisory 阶段：结果写入日志并打 warning，不置红 job；
        # 待现有 5 个 high（eslint 工具链）修复后，可去掉 warning 分支转强制门禁。
        run: |
          if osv-scanner scan source -r ./; then
            echo "::notice::osv-scanner 未发现漏洞"
          else
            echo "::warning::osv-scanner 发现漏洞或执行异常，详见上方日志"
          fi

  # ── 死链校验（文档/页面外链）──
  lychee:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lychee 死链检查
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --exclude-mail './**/*.md'
          fail: false

  # ── PR 依赖审查（仅 PR 触发，比对 base 的依赖变更）──
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency Review
        # ⚠️ 该 action 的 v4 移动标签不存在（实测 404），只能 pin 具体版本。
        # 该 job 仅在 PR 触发，本地无法验证，故更需谨慎核对标签。
        uses: actions/dependency-review-action@v4.9.0

  # ── CI 工作流自身安全审计（zizmor）──
  zizmor:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    # zizmor 需要 actions:read（读取工作流定义）与 security-events:write（上传 SARIF）。
    # 仓库若未开启 GitHub Advanced Security 公开扫描，上传会失败，
    # 但 zizmor 主扫描步骤在日志中仍可见结果，不影响排查。
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # zizmor 官方建议：审计 CI 配置时不应把凭据留在工作区，防止误扫/误用
          persist-credentials: false
      - name: Zizmor（GitHub Actions 工作流安全审计）
        # ⚠️ 仓库已从 woodruffw/zizmor 迁移至 zizmorcore/zizmor（旧路径 404）。
        #    官方文档建议对 zizmor-action 使用完整 SHA pin（该 action 会执行
        #    下载自上游仓库的二进制，移动标签风险高于普通 action），此处照办。
        #    当前 SHA 对应 v0.6.4（实施时与官方文档交叉核对一致）。
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  # ── 供应链健康分（OpenSSF Scorecard，公开库免费）──
  scorecard:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    permissions:
      contents: read
      security-events: write # 上传 Scorecard SARIF 需要；读仓库元数据用内置 GITHUB_TOKEN
      # publish_results: true 必需：scorecard 用 GitHub OIDC 令牌对结果做
      # 密钥less 签名后发布到 scorecard.dev（徽章/REST API 的前提）。
      # 官方约束：本工作流内仅此 job 可用 id-token: write，且工作流级不得有写权限。
      id-token: write
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scorecard 分析
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # 公开库：把分数发布到 scorecard.dev，徽章可直接引用
          # https://api.scorecard.dev/projects/github.com/xiaoyu-hue/jiuxi/badges/score
          publish_results: true
      - name: 上传 Scorecard SARIF 到代码扫描告警
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: scorecard

  # ── DAST：每周定时扫描生产主站（调用可复用工作流，避免与部署后扫描配置漂移）──
  zap-baseline:
    # ⚠️ 调用可复用工作流的 job 只允许 name/uses/with/secrets/needs/if/permissions/strategy
  # 这几个键——runs-on 与 continue-on-error 写在这里会导致工作流解析失败（红叉）。
  # advisory 语义由被调用工作流 dast-scan.yml 内部的 job 级 continue-on-error 承载。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/dast-scan.yml
    # 复用工作流的 secrets 需显式传递（inherit 亦可，本项目无敏感 secrets，用 inherit 最简）
    secrets: inherit
