# 九溪 · 安全门禁（独立于 deploy.yml，便于分层查看）
#
# 涵盖：密钥扫描(gitleaks + trufflehog) / SAST(CodeQL) / 依赖漏洞(osv-scanner 强制 + trivy fs) /
# 漏洞模板扫描(nuclei 扫本地构建产物) / 死链(lychee) / SBOM 供应链清单(anchore/sbom-action) /
# PR 依赖审查(dependency-review) / CI 工作流审计(zizmor) / 供应链健康分(Scorecard) /
# DAST 动态扫描(ZAP，见 dast-scan.yml 可复用工作流，每周+部署后由本文件与 deploy.yml 调用)。
# 每个 job 第一步均装 harden-runner（出口审计模式）。
#
# 门禁强度（2026-10-15 审查后）：
#   **强制**（无 continue-on-error，发现即红灯阻断合并）：
#     osv-scanner（依赖漏洞，2026-10-13 起强制）；
#     trufflehog（历史密钥扫描，2026-10-15 起强制，见 trufflehog job 内说明；
#       扫描命令带 --no-update 禁用其自更新器，原因见 job 内注释）。
#   **advisory**（job 级 continue-on-error，失败只标红本 job 不阻断）：
#     gitleaks / codeql / trivy / nuclei / lychee / dependency-review /
#     zizmor / scorecard / sbom。
# 为什么 advisory 的 continue-on-error 必须写在 **job 级别**（不是 step 级别）：
#   step 级别的 continue-on-error 无法覆盖 action 引用解析失败
#   （失败发生在 "Set up job" 阶段，不属于任何 step），一旦某个门禁挂掉整条
#   工作流就会变红，advisory 语义形同虚设。写在 job 级别才能真正做到
#   "单个门禁失败不影响流水线结论"，同时在 job 行仍保留红叉便于排查。
# 转强制的判据：门禁误报率已被实际运行验证可接受（osv-scanner 与 trufflehog
#   均只报"实测有效/确定命中"，误报空间小），故敢于阻断。
#
# ⚠️ Action 引用约定（本文件已逐个实测，勿凭印象写版本号）：
#   1. 不是所有 Action 都提供大版本移动标签。
#      actions/dependency-review-action 的 v4 就不存在（404），只能 pin v4.9.0。
#   2. 标签存在 ≠ Action 可用。
#      google/osv-scanner-action 所有 tag 的 action.yml 都缺顶层 `runs:` 段，
#      引用即失败，故本项目改用其官方 CLI 二进制（见 osv-scanner job）。
#   3. 仅在 PR 触发的 job 本地永远验证不到（一直是 skipped），
#      例如 dependency-review，引用前更需逐一核实。
#   4. 仓库迁移会改路径：zizmor 的 action 旧路径 woodruffw/zizmor-action 已 404，
#      现为 zizmorcore/zizmor-action（官方文档推荐 SHA pin，故本文件用 SHA）。
#   5. 第三方 action 不是唯一形态：官方 CLI 二进制 + pin 版本 + SHA256 校验同样
#      满足供应链安全，且不受 action.yml 损坏影响（osv-scanner 即因此改用 CLI）。
#      trufflehog 沿用同一模式。
#   已核实可用（2026-10-13 起全部 SHA pin，标签仅作注释；Dependabot 依据尾部
#     版本注释把 SHA 滚动到各 action 最新发布，兼顾供应链安全与可更新性）：
#     checkout@v7.0.1、gitleaks@v3.0.0、codeql@v3、lychee@v2、
#     zaproxy/action-baseline@v0.15.0、zizmorcore/zizmor-action@v0.6.4（SHA cc914d7f…）、
#     ossf/scorecard-action@v2.5.0、actions/dependency-review-action@v5.0.0、
#     step-security/harden-runner@v2.22.1、actions/setup-node@v7.0.0（node-version 22）、
#     anchore/sbom-action@v0.24.3（SHA 66cbf4bc…，本批新增）。
#     trivy / nuclei 为官方 CLI 二进制（pin 版本 + SHA256 校验），非 Action，不在本列表。
#     所有 SHA 已随 v1.4.0 的 CI 实测可用（绿）；升级时同步更新尾部版本注释。

name: 安全门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # 每周一 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read
  # ⚠️ 不要把 security-events: write 写在这里（工作流级）！
  # scorecard-action v2 的 publish_results: true 要求：所在工作流不得有工作流级
  # 写权限，且只有 scorecard 这个 job 能用 id-token: write（用于 GitHub OIDC
  # 签名发布结果）。缺 id-token 时发布会退化为交互式设备流，CI 无人点浏览器，
  # 300 秒后 expired_token → job 失败（2026-10-13 首跑实测踩坑）。
  # 因此需要 security-events: write 的 job（gitleaks/codeql/zizmor/scorecard）
  # 各自在 job 级单独声明。

jobs:
  # ── 密钥扫描 ──
  gitleaks:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory：失败只标红本 job，不阻断整条流水线
    permissions:
      contents: read
      security-events: write # gitleaks-action 自动上传 SARIF 到代码扫描需要
      # PR 事件扫描需要（gitleaks-action v2.3 起破坏性变更）：列 PR 提交走 GitHub API，
      # 缺 pull-requests 读权限时 job 直接失败（本仓库此前无 PR，隐患一直未暴露）
      pull-requests: read
    steps:
      # harden-runner 必须是每个 job 的第一步（pre 步骤，先于 checkout 运行）。
      # audit = 只记录出口流量不阻断；block 模式会断掉本 job 的必要出站连接。
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 本 job 只读仓库、不推送，关闭凭据持久化（zizmor artipacked 修复）
          persist-credentials: false
      - name: Gitleaks（密钥扫描）
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # gitleaks-action v2.3 起破坏性变更：PR 事件扫描强制要求 GITHUB_TOKEN
          # （经 GitHub API 列 PR 提交、在 PR 上评论发现项），缺失即 job 失败
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 密钥扫描 · 第二引擎（TruffleHog，全量历史 + 已验证，强制门禁）──
  # 为什么在 gitleaks 之外再上一道：
  #   1. gitleaks 扫的是当前文件与近期提交；TruffleHog 的 git 模式遍历**全部**
  #      提交历史，能发现「早已删除但仍在历史里」的密钥；
  #   2. --only-verified 会拿密钥去各云厂商 API 实测有效性，报出的必然是
  #      「真的能用」的密钥（gitleaks 报的是模式匹配，误报率相对高）。
  # 许可证：TruffleHog 为 AGPL-3.0，本项目代码为 Apache-2.0。CI 中以独立进程
  #   运行其官方二进制，不链接、不分发其源码，AGPL 的网络交互条款不触发，
  #   两许可证互不影响（README「致谢与开源声明」已注明）。
  # 形态与 osv-scanner job 同构：官方 CLI + pin 版本 + SHA256 校验，
  #   不用第三方 action（供应链面更小，且不受 action.yml 损坏影响）。
  # 2026-10-15 审查 M22：由 advisory 转**强制**——只报已验证密钥意味着
  # 误报率足够低，发现真实泄露的密钥必须阻断合并、立即轮换。
  # ⚠️ 转强制风险提示：本 job 扫完整历史，若历史提交里存在已验证密钥，
  #    首次运行即红灯。届时须人工清理历史（git filter-repo / BFG）并轮换
  #    该密钥，或在 run 步骤补 --exclude-paths 精确排除（排除项须在注释中
  #    说明理由，禁止无理由大面积排除）。
  trufflehog:
    runs-on: ubuntu-24.04
    # 强制门禁：不再写 continue-on-error，发现已验证密钥直接红灯阻断合并。
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 必须：TruffleHog git 模式要扫完整提交历史
          persist-credentials: false
      - name: 安装 TruffleHog CLI（pin 版本 + SHA256 校验）
        run: |
          set -euo pipefail
          VERSION="${TRUFFLEHOG_VERSION}"
          PKG="trufflehog_${VERSION#v}_linux_amd64.tar.gz"
          SUMS="trufflehog_${VERSION#v}_checksums.txt"
          BASE="https://github.com/trufflesecurity/trufflehog/releases/download/${VERSION}"
          curl -sSfL -o /tmp/trufflehog.tar.gz "${BASE}/${PKG}"
          curl -sSfL -o /tmp/trufflehog_checksums.txt "${BASE}/${SUMS}"
          # checksums.txt 可能是 "<hash>  name" 或 "<hash> *name" 两种格式，兼容处理
          expected="$(awk -v pkg="$PKG" '{gsub(/^[*]/,"",$2); if($2==pkg) print $1}' /tmp/trufflehog_checksums.txt)"
          actual="$(sha256sum /tmp/trufflehog.tar.gz | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::TruffleHog 压缩包 SHA256 校验失败（期望 ${expected:-<空>} 实际 $actual）"
            exit 1
          fi
          mkdir -p /tmp/trufflehog-bin
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp/trufflehog-bin
          sudo install -m 0755 "$(find /tmp/trufflehog-bin -type f -name trufflehog | head -n 1)" /usr/local/bin/trufflehog
          # --no-update 必须加（原因见下方扫描步骤注释）：自更新器在主入口
          # 初始化时执行，这个留痕调用也会触发它（2026-10-15 实测），此处靠
          # || true 兜底不致命，但扫描步骤没有兜底、必须显式禁用。
          trufflehog --version || true # 仅用于留痕，不参与判定
        env:
          TRUFFLEHOG_VERSION: v3.99.2 # 升级时同步核对 releases 资产名与 checksums 文件名
      - name: TruffleHog（历史密钥扫描，仅已验证，强制门禁）
        # git file:// 模式遍历全部提交历史（checkout 已 fetch-depth: 0）；
        # --only-verified 只报实测有效的密钥（误报率足够低，故敢转强制）；
        # --fail 让发现项以非零退出码使 job 置红、阻断合并（run 步骤默认
        # bash -e 语义，不需要再包 if 捕获——2026-10-15 审查 M22 转强制）。
        # 路径用 shell 环境变量 $GITHUB_WORKSPACE 而非 ${{ }} 插值：避免 zizmor
        # 模板注入检查误报（run 脚本内直接插值上下文表达式是其重点审查对象）。
        # --no-update（2026-10-15 新增）：禁用自更新器。自更新器在 CI 环境
        # 尝试替换 /usr/local/bin/trufflehog 自身二进制失败
        # （"error occurred with trufflehog updater 🐷 {"error":
        # "cannot move binary back (exit status 1)"}"，trufflesecurity/
        # trufflehog#3217 同款问题，本项目 v1.6.1 推送后首次实测复现），
        # 且失败即退出 1——扫描根本没跑就红灯，曾长期被 advisory 的
        # continue-on-error + 输出捕获掩盖为"假绿"。版本由上方安装步骤
        # pin + SHA256 校验固定，CI 环境不应运行时自更新，禁用不影响门禁语义。
        run: |
          trufflehog git "file://$GITHUB_WORKSPACE" --only-verified --fail --no-update

  # ── SAST：CodeQL（公开库免费，无需 token）──
  codeql:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    permissions:
      contents: read
      security-events: write # CodeQL 上传分析结果需要
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: javascript-typescript
      - name: CodeQL 分析
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3

  # ── 依赖漏洞扫描 ──
  osv-scanner:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    # 2026-10-13 起转强制：eslint 工具链 5 个 high 已修复（升级 eslint-plugin-astro
    # 3.2.1 + eslint 10，绕开 braces 全版本无修复的漏洞链），本地 npm audit 0 漏洞。
    # 不再写 continue-on-error——发现依赖漏洞直接红灯，必须先升级依赖再合并。
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ⚠️ 为什么不用 google/osv-scanner-action：
      #    该仓库根 action.yml 自 v1.9.2 起就缺少顶层 `runs:` 段（实测每个 tag 都是
      #    18 行的残缺文件），runner 会报
      #    “Top level 'runs:' section is required …/action.yml”，
      #    即该 Action 目前整体不可用，与写 @v1 还是 @v2.6.0 无关。
      #    故改为直接使用官方 CLI 二进制（版本 pin + SHA256 校验）。
      - name: 安装 osv-scanner CLI（pin 版本 + SHA256 校验）
        run: |
          set -euo pipefail
          VERSION="${OSV_VERSION}"
          BASE="https://github.com/google/osv-scanner/releases/download/${VERSION}"
          curl -sSfL -o /tmp/osv-scanner "${BASE}/osv-scanner_linux_amd64"
          curl -sSfL -o /tmp/osv-scanner_SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          # SHA256SUMS 可能是 "<hash>  name" 或 "<hash> *name" 两种格式，兼容处理
          expected="$(awk '{gsub(/^[*]/,"",$2); if($2=="osv-scanner_linux_amd64") print $1}' /tmp/osv-scanner_SHA256SUMS)"
          actual="$(sha256sum /tmp/osv-scanner | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::osv-scanner 二进制 SHA256 校验失败（期望 ${expected:-<空>} 实际 $actual）"
            exit 1
          fi
          chmod +x /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version || true # 仅用于留痕，不同版本子命令差异不影响门禁
        env:
          OSV_VERSION: v2.6.0 # 升级时同步核对 releases 资产与 SHA256SUMS
      - name: OSV Scanner（依赖漏洞扫描，强制门禁）
        # 用法按 v2.6.0 README 的官方示例：osv-scanner scan source -r <dir>。
        # 强制语义：发现漏洞即以非零退出码使 job 置红，阻断合并（不包 warning 分支）。
        # 若 CI 报错“发现漏洞”，先在本地方 `npm update` 对应依赖修复后再推送。
        run: |
          osv-scanner scan source -r ./

  # ── 依赖漏洞 / 配置错误 / 密钥扫描（Trivy fs 模式）──
  # 为什么在 osv-scanner 之外再上一道：
  #   osv-scanner 只查依赖漏洞（OSV 数据库）；Trivy fs 一套扫描同时覆盖
  #     依赖漏洞 + 文件系统配置错误(misconfig) + 密钥泄露(secret)，且内部库与 OSV 互补。
  #   双引擎交叉验证，降低单一数据库漏报/误报风险。osv-scanner 已转强制，
  #   Trivy 先以 advisory 运行观察误报率，后续再决定是否转强制。
  # 形态同 trufflehog：官方 CLI + pin 版本 + SHA256 校验（不用第三方 action）。
  trivy:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Trivy CLI（pin 版本 + SHA256 校验）
        run: |
          set -euo pipefail
          VERSION="${TRIVY_VERSION}"
          PKG="trivy_${VERSION#v}_Linux-64bit.tar.gz"
          SUMS="trivy_${VERSION#v}_checksums.txt"
          BASE="https://github.com/aquasecurity/trivy/releases/download/${VERSION}"
          curl -sSfL -o /tmp/trivy.tar.gz "${BASE}/${PKG}"
          curl -sSfL -o /tmp/trivy_checksums.txt "${BASE}/${SUMS}"
          expected="$(awk -v pkg="$PKG" '{gsub(/^[*]/,"",$2); if($2==pkg) print $1}' /tmp/trivy_checksums.txt)"
          actual="$(sha256sum /tmp/trivy.tar.gz | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::Trivy 压缩包 SHA256 校验失败（期望 ${expected:-<空>} 实际 $actual）"
            exit 1
          fi
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
        env:
          TRIVY_VERSION: v0.75.0 # 升级时同步核对 releases 资产名与 checksums 文件名
      - name: Trivy fs（依赖漏洞 + 配置错误 + 密钥）
        # --scanners vuln,misconfig,secret：一套扫描三类问题；
        # --exit-code 0：advisory 阶段发现不置红（与 trufflehog 同策略）；
        # 待误报率可接受后改 --exit-code 1 转强制。
        # --skip-dirs 排除构建产物与依赖目录，只扫源码与锁文件。
        run: |
          trivy fs --scanners vuln,misconfig,secret --exit-code 0 \
            --skip-dirs dist --skip-dirs node_modules ./ \
            || echo "::warning::Trivy 执行异常（advisory 阶段不阻断），详见上方日志"

  # ── 漏洞模板扫描（Nuclei，本地构建产物）──
  # 定位：与 ZAP 互补——ZAP 每周扫生产主站（见 dast-scan.yml），Nuclei 在每次
  # 推送/PR 时扫**本地构建并临时起服务的产物**，不依赖生产站点、不产生外网攻击流量，
  # 适合作为 PR/推送阶段的快速模板扫描（advisory）。
  # 注意：本地起服务扫的是构建产物，与生产的 CDN/Headers/Functions 运行时有差异，
  # 不能替代 ZAP 对生产站的扫描，两者互补而非替代。
  nuclei:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 准备 Node 环境（与 deploy.yml 一致）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: 安装 Nuclei CLI（pin 版本 + SHA256 校验）
        run: |
          set -euo pipefail
          VERSION="${NUCLEI_VERSION}"
          PKG="nuclei_${VERSION#v}_linux_amd64.zip"
          SUMS="nuclei_${VERSION#v}_checksums.txt"
          BASE="https://github.com/projectdiscovery/nuclei/releases/download/${VERSION}"
          curl -sSfL -o /tmp/nuclei.zip "${BASE}/${PKG}"
          curl -sSfL -o /tmp/nuclei_checksums.txt "${BASE}/${SUMS}"
          expected="$(awk -v pkg="$PKG" '{gsub(/^[*]/,"",$2); if($2==pkg) print $1}' /tmp/nuclei_checksums.txt)"
          actual="$(sha256sum /tmp/nuclei.zip | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::Nuclei 压缩包 SHA256 校验失败（期望 ${expected:-<空>} 实际 $actual）"
            exit 1
          fi
          unzip -o -q /tmp/nuclei.zip -d /tmp/nuclei-bin
          sudo install -m 0755 /tmp/nuclei-bin/nuclei /usr/local/bin/nuclei
          nuclei -version 2>&1 | head -n 3 || true
        env:
          NUCLEI_VERSION: v3.11.1 # 升级时同步核对 releases 资产名与 checksums 文件名
      - name: 构建站点并本地起静态服务
        # dist/ 已被 .gitignore 忽略，故需临时构建；复用 deploy.yml 的 CF 主站构建参数
        # （node 22 + npm ci + SITE_URL）。后台起 python3 http.server，扫描结束统一 kill。
        env:
          SITE_URL: https://jiuxi-bm1.pages.dev
        run: |
          set -euo pipefail
          npm ci
          npm run build
          nohup python3 -m http.server 8080 --directory dist >/tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          for i in $(seq 1 15); do
            if curl -s -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
      - name: Nuclei 模板扫描（本地产物）
        # advisory：仅 critical/high 级，发现不置红；扫完由下一步收尾杀服务。
        run: |
          nuclei -target http://127.0.0.1:8080 -severity critical,high -no-color \
            || echo "::warning::Nuclei 发现问题或运行异常（advisory 阶段不阻断），详见上方日志"
      - name: 收尾（杀掉本地静态服务）
        if: always()
        run: |
          if [ -f /tmp/http.pid ]; then kill "$(cat /tmp/http.pid)" 2>/dev/null || true; fi

  # ── 死链校验（文档/页面外链）──
  lychee:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lychee 死链检查
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-concurrency 4 --exclude-mail './**/*.md'
          fail: false

  # ── PR 依赖审查（仅 PR 触发，比对 base 的依赖变更）──
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        # ⚠️ 该 action 的 v4/v5 移动标签均不存在（实测 404），只能 pin 具体版本。
        # 该 job 仅在 PR 触发，本地无法验证，故更需谨慎核对标签。
        # v5.0.0 为 Dependabot 漏开的升级（github-actions 更新任务部分失败），
        # 经核实 v5.0.0 的 action.yml 输入与本 job 用法（无 with 参数）兼容后手动补上；
        # 同时消除 Node 20 弃用告警（v4 基于 Node 20）。
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # ── CI 工作流自身安全审计（zizmor）──
  zizmor:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    # zizmor 需要 actions:read（读取工作流定义）与 security-events:write（上传 SARIF）。
    # 仓库若未开启 GitHub Advanced Security 公开扫描，上传会失败，
    # 但 zizmor 主扫描步骤在日志中仍可见结果，不影响排查。
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor 官方建议：审计 CI 配置时不应把凭据留在工作区，防止误扫/误用
          persist-credentials: false
      - name: Zizmor（GitHub Actions 工作流安全审计）
        # ⚠️ 仓库已从 woodruffw/zizmor 迁移至 zizmorcore/zizmor（旧路径 404）。
        #    官方文档建议对 zizmor-action 使用完整 SHA pin（该 action 会执行
        #    下载自上游仓库的二进制，移动标签风险高于普通 action），此处照办。
        #    当前 SHA 对应 v0.6.4（实施时与官方文档交叉核对一致）。
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  # ── 供应链健康分（OpenSSF Scorecard，公开库免费）──
  scorecard:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory
    permissions:
      contents: read
      security-events: write # 上传 Scorecard SARIF 需要；读仓库元数据用内置 GITHUB_TOKEN
      # publish_results: true 必需：scorecard 用 GitHub OIDC 令牌对结果做
      # 密钥less 签名后发布到 scorecard.dev（徽章/REST API 的前提）。
      # 官方约束：本工作流内仅此 job 可用 id-token: write，且工作流级不得有写权限。
      id-token: write
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scorecard 分析
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # 公开库：把分数发布到 scorecard.dev，徽章可直接引用
          # https://api.scorecard.dev/projects/github.com/xiaoyu-hue/jiuxi/badge
          publish_results: true
      - name: 上传 Scorecard SARIF 到代码扫描告警
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: results.sarif
          category: scorecard

  # ── SBOM 供应链清单生成（每次推送留档 90 天，漏洞应急时反查）──
  # 用途：生成 CycloneDX JSON 格式的软件物料清单，作为 workflow artifact 留存 90 天。
  # 出事时（某依赖爆 0day）可按 SBOM 秒级定位「我们具体哪些版本受影响」。
  # 用 anchore/sbom-action（官方 action，Syft 引擎，SHA pin + 版本注释供 Dependabot 滚动）。
  sbom:
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory：生成失败不影响流水线结论
    permissions:
      contents: read
    steps:
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 生成 SBOM（CycloneDX JSON）
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: cyclonedx-json
          artifact-name: jiuxi-sbom.cdx.json
          output-file: jiuxi-sbom.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false # 本工作流不触发 release，关闭避免非预期上传
          # dependency-snapshot 默认 false：不上传依赖快照到 GitHub（无需额外权限）；
          # 仅生成并留存 SBOM artifact。

  # ── DAST：每周定时扫描生产主站（调用可复用工作流，避免与部署后扫描配置漂移）──
  zap-baseline:
    # ⚠️ 调用可复用工作流的 job 只允许 name/uses/with/secrets/needs/if/permissions/strategy
    # 这几个键——runs-on 与 continue-on-error 写在这里会导致工作流解析失败（红叉）。
    # advisory 语义由被调用工作流 dast-scan.yml 内部的 job 级 continue-on-error 承载。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # 自引用语法（GitHub 2026-07 起官方支持）：$/ 解析到当前运行的提交，
    # 比 ./ 更安全（zizmor self-repository 告警的修复）。
    # 被调工作流不使用任何 secrets，故不传 secrets（zizmor secrets-inherit 修复）。
    uses: $/.github/workflows/dast-scan.yml
