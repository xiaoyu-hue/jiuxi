# 九溪 · DAST 动态扫描（可复用工作流）
#
# 为什么单独一个文件：ZAP 有两个触发时机——security.yml 的每周定时巡检 +
# deploy.yml 的部署成功后即时扫描。用 `workflow_call` 可复用工作流承载，
# 扫描目标与参数只维护一处，避免两份 job 配置漂移。
#
# 为什么是 baseline 模式：zap-baseline 只做被动扫描 + 蜘蛛爬取，不发动攻击，
# 对生产站安全（行业常规做法）；含主动攻击的 full scan 从不安排在生产上。
#
# 扫描目标：Cloudflare 站点（https://jiuxi-bm1.pages.dev/）——现为纯静态站，
# 内容在构建期预渲染注入各页内嵌 JSON；ZAP 蜘蛛爬取即覆盖全部页面，无服务端攻击面。
#
# advisory 约定：job 级 continue-on-error。ZAP action 的 fail_action 默认 false，
# 发现只进日志与 artifact、不把 job 搞红；真执行错误才会红，但也不阻断调用方。

name: DAST · ZAP Baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP Baseline（动态扫描生产主站）
    runs-on: ubuntu-24.04 # 固定版本：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26
    continue-on-error: true # advisory：本 job 红叉不阻断调用方流水线
    steps:
      # harden-runner 必须是每个 job 的第一步（pre 步骤，先于 checkout 运行）。
      # audit = 只记录出口流量不阻断；block 模式会断掉 ZAP 扫站点的必要出站连接。
      - name: Harden-Runner（出口审计）
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://jiuxi-bm1.pages.dev/
          # 关掉自动开 issue：个人仓库不需要每次扫描都刷一个 issue，
          # 且开 issue 需要 issues:write 权限（本工作流未授予，开启反而会报错）。
          allow_issue_writing: false
          # fail_action 默认 false：有发现也不让本步失败（advisory 语义），
          # 报告进 job 摘要与 zap_scan artifact。
          fail_action: false
          artifact_name: zap_scan
